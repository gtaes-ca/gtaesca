# HTTPS config — copied to conf.d/gtaes.conf by scripts/init-ssl.sh

upstream gtaes_api {
    server api:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gtaes.nicheye.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gtaes.nicheye.com;

    ssl_certificate /etc/letsencrypt/live/gtaes.nicheye.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtaes.nicheye.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://gtaes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
