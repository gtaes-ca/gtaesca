<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Electric Services | Admin</title>

  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #262d34 0%, #1a1f24 100%);
      display: flex;
      height: 100%;
      width: 100%;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      overflow: hidden;
    }

    .splash-screen__logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .splash-screen__logo {
      display: block;
      height: 72px;
      width: auto;
      max-width: min(280px, 70vw);
      object-fit: contain;
    }

    #splash-screen.remove {
      animation: fadeout 0.7s forwards;
      z-index: 0;
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <div id="splash-screen">
    <div class="splash-screen__logo-wrap">
      <img alt="GTA Electric Services" class="splash-screen__logo" src="/logo-dark-full.png" />
    </div>
  </div>
  <script type="module" src="/src/main"></script>
  <script>
    const rootEl = document.querySelector('#root')
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(rootEl, { childList: true });
  </script>
</body>

</html>
